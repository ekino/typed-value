config:
  validation: true
  warningsAsErrors: false

comments:
  DocumentationOverPrivateFunction:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

complexity:
  # detekt 2.x counts "allowed" values exclusively, where 1.x thresholds were inclusive:
  # allowedComplexity: 19 == threshold: 20
  CyclomaticComplexMethod:
    allowedComplexity: 19
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 9
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 3
    excludedFunctions: [ 'equals' ]
  # UnnecessaryAbstractClass was split in two in detekt 2.x
  AbstractClassCanBeConcreteClass:
    excludes: ['**/typedvalue/hibernate/*.kt','**/typedvalue/hibernate/entity/*.kt', '**/gradle/*.kt']
  AbstractClassCanBeInterface:
    excludes: ['**/typedvalue/hibernate/*.kt','**/typedvalue/hibernate/entity/*.kt', '**/gradle/*.kt']
